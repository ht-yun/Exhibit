<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>飞书数据智能看板</title>
    <meta name="description" content="飞书多维表格与云文档数据实时同步看板">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #10b981;
            --primary-light: #34d399;
            --bg: #f8fafc;
            --bg-secondary: #f1f5f9;
            --card: rgba(255, 255, 255, 0.85);
            --card-hover: rgba(255, 255, 255, 1);
            --text: #334155;
            --text-dim: #64748b;
            --text-muted: #94a3b8;
            --accent: #059669;
            --accent-blue: #0ea5e9;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --border: rgba(16, 185, 129, 0.15);
            --border-hover: rgba(16, 185, 129, 0.3);
            --glow-primary: rgba(16, 185, 129, 0.15);
            --glow-accent: rgba(52, 211, 153, 0.1);
            --radius: 16px;
            --radius-sm: 10px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: -200px;
            left: -100px;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(16, 185, 129, 0.08) 0%, transparent 70%);
            pointer-events: none;
            z-index: 0;
        }
        body::after {
            content: '';
            position: fixed;
            bottom: -200px;
            right: -100px;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(52, 211, 153, 0.06) 0%, transparent 70%);
            pointer-events: none;
            z-index: 0;
        }

        /* === 落叶动画 === */
        .leaf-container {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }
        .leaf {
            position: absolute;
            top: -50px;
            width: 28px;
            height: 28px;
            fill: rgba(16, 185, 129, 0.15);
            filter: blur(0.5px);
            animation: fall var(--duration) linear infinite, sway 5s ease-in-out infinite alternate;
            animation-delay: var(--delay);
            transform: rotate(var(--rotate-start));
        }
        @keyframes fall {
            0% { top: -50px; opacity: 0; }
            10% { opacity: 1; }
            80% { opacity: 0.8; }
            100% { top: 110vh; opacity: 0; }
        }
        @keyframes sway {
            0% { transform: translateX(0px) rotate(0deg); }
            100% { transform: translateX(60px) rotate(60deg); }
        }

        .app {
            position: relative;
            z-index: 1;
            max-width: 1280px;
            margin: 0 auto;
            padding: 2rem 2rem 4rem;
        }

        /* === HEADER === */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 2.5rem;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .logo {
            width: 42px;
            height: 42px;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            font-weight: 700;
            flex-shrink: 0;
            box-shadow: 0 4px 20px var(--glow-primary);
        }

        .header-title h1 {
            font-size: 1.6rem;
            font-weight: 700;
            background: linear-gradient(135deg, #065f46, #10b981, #34d399);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.02em;
        }

        .header-title p {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-top: 2px;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .sync-indicator {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.5rem 1rem;
            background: rgba(34, 211, 238, 0.08);
            border: 1px solid rgba(34, 211, 238, 0.15);
            border-radius: 24px;
            font-size: 0.78rem;
            color: var(--accent);
        }

        .sync-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--accent);
            animation: pulse 2s ease-in-out infinite;
        }

        .sync-indicator.error {
            background: rgba(248, 113, 113, 0.08);
            border-color: rgba(248, 113, 113, 0.15);
            color: var(--danger);
        }

        .sync-indicator.error .sync-dot {
            background: var(--danger);
            animation: none;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(0.8); }
        }

        .search-box {
            position: relative;
            width: 260px;
        }

        .search-box svg {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            width: 16px;
            height: 16px;
            color: var(--text-muted);
            pointer-events: none;
        }

        .search-box input {
            width: 100%;
            padding: 0.6rem 0.8rem 0.6rem 2.2rem;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            color: var(--text);
            font-size: 0.85rem;
            font-family: inherit;
            outline: none;
            backdrop-filter: blur(12px);
            transition: all 0.3s ease;
        }

        .search-box input::placeholder {
            color: var(--text-muted);
        }

        .search-box input:focus {
            border-color: var(--primary-light);
            box-shadow: 0 0 0 3px var(--glow-primary);
        }

        .stats-row {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .stat-card {
            background: var(--card);
            backdrop-filter: blur(16px);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 1.25rem 1.5rem;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
            box-shadow: 0 8px 32px rgba(5, 150, 105, 0.04);
        }

        .stat-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            border-radius: var(--radius) var(--radius) 0 0;
        }

        .stat-card:nth-child(1)::before { background: linear-gradient(90deg, var(--primary), var(--primary-light)); }
        .stat-card:nth-child(2)::before { background: linear-gradient(90deg, #14b8a6, #2dd4bf); }
        .stat-card:nth-child(3)::before { background: linear-gradient(90deg, var(--success), #10b981); }
        .stat-card:nth-child(4)::before { background: linear-gradient(90deg, var(--warning), #f59e0b); }

        .stat-card:hover {
            border-color: var(--border-hover);
            transform: translateY(-2px);
        }

        .stat-label {
            font-size: 0.75rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 0.5rem;
        }

        .stat-value {
            font-size: 1.8rem;
            font-weight: 700;
            letter-spacing: -0.02em;
        }

        .stat-card:nth-child(1) .stat-value { color: var(--primary-light); }
        .stat-card:nth-child(2) .stat-value { color: var(--accent); }
        .stat-card:nth-child(3) .stat-value { color: var(--success); }
        .stat-card:nth-child(4) .stat-value { color: var(--warning); }

        .stat-sub {
            font-size: 0.72rem;
            color: var(--text-muted);
            margin-top: 0.3rem;
        }

        /* === TABS & FILTERS === */
        .toolbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
            gap: 0.75rem;
        }

        .tabs {
            display: flex;
            gap: 0.25rem;
            background: rgba(17, 24, 39, 0.6);
            border-radius: var(--radius-sm);
            padding: 3px;
            border: 1px solid var(--border);
        }

        .tab {
            padding: 0.45rem 1rem;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.82rem;
            font-weight: 500;
            color: var(--text-dim);
            background: transparent;
            border: none;
            font-family: inherit;
            transition: all 0.25s ease;
            white-space: nowrap;
        }

        .tab.active {
            background: var(--primary);
            color: #fff;
            box-shadow: 0 2px 8px rgba(99, 102, 241, 0.3);
        }

        .tab:not(.active):hover {
            color: var(--text);
            background: rgba(255, 255, 255, 0.04);
        }

        .categories {
            display: flex;
            gap: 0.5rem;
            overflow-x: auto;
            padding-bottom: 2px;
            flex-wrap: wrap;
        }

        .category-tag {
            padding: 0.35rem 0.85rem;
            background: transparent;
            border: 1px solid var(--border);
            border-radius: 20px;
            cursor: pointer;
            white-space: nowrap;
            font-size: 0.78rem;
            font-weight: 500;
            color: var(--text-dim);
            font-family: inherit;
            transition: all 0.2s ease;
        }

        .category-tag.active {
            background: rgba(99, 102, 241, 0.12);
            border-color: rgba(99, 102, 241, 0.3);
            color: var(--primary-light);
        }

        .category-tag:not(.active):hover {
            border-color: var(--border-hover);
            color: var(--text);
        }

        .category-count {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 18px;
            height: 18px;
            padding: 0 5px;
            background: rgba(255, 255, 255, 0.06);
            border-radius: 9px;
            font-size: 0.68rem;
            margin-left: 4px;
        }

        .category-tag.active .category-count {
            background: rgba(99, 102, 241, 0.2);
        }

        /* === DATA GRID === */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: 1rem;
        }

        .card {
            background: var(--card);
            backdrop-filter: blur(16px);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 1.25rem 1.5rem;
            transition: all 0.3s ease;
            cursor: pointer;
            position: relative;
            animation: cardIn 0.4s ease-out both;
        }

        .card:hover {
            border-color: var(--border-hover);
            transform: translateY(-3px);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.25);
        }

        .card.expanded {
            grid-column: 1 / -1;
        }

        @keyframes cardIn {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .card-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 0.75rem;
        }

        .card-badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            font-size: 0.7rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            padding: 3px 8px;
            border-radius: 6px;
        }

        .card-badge.table {
            background: rgba(99, 102, 241, 0.12);
            color: var(--primary-light);
        }

        .card-badge.doc {
            background: rgba(34, 211, 238, 0.1);
            color: var(--accent);
        }

        .card-time {
            font-size: 0.72rem;
            color: var(--text-muted);
        }

        .card-title {
            font-size: 1.05rem;
            font-weight: 600;
            line-height: 1.45;
            margin-bottom: 0.6rem;
            color: var(--text);
        }

        .card-preview {
            font-size: 0.82rem;
            color: var(--text-dim);
            line-height: 1.6;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            word-break: break-all;
        }

        .card.expanded .card-preview {
            display: block;
            -webkit-line-clamp: unset;
        }

        .card-detail {
            display: none;
            margin-top: 1rem;
            padding-top: 1rem;
            border-top: 1px solid var(--border);
        }

        .card.expanded .card-detail {
            display: block;
            animation: detailIn 0.3s ease-out;
        }

        @keyframes detailIn {
            from { opacity: 0; transform: translateY(-6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .detail-row {
            display: flex;
            padding: 0.4rem 0;
            font-size: 0.82rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
        }

        .detail-row:last-child {
            border-bottom: none;
        }

        .detail-key {
            color: var(--text-muted);
            min-width: 120px;
            flex-shrink: 0;
            font-weight: 500;
        }

        .detail-value {
            color: var(--text-dim);
            word-break: break-all;
        }

        .card-expand-hint {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            margin-top: 0.75rem;
            font-size: 0.72rem;
            color: var(--text-muted);
            transition: color 0.2s;
        }

        .card:hover .card-expand-hint {
            color: var(--primary-light);
        }

        .card-expand-hint svg {
            width: 14px;
            height: 14px;
            transition: transform 0.3s ease;
        }

        .card.expanded .card-expand-hint svg {
            transform: rotate(180deg);
        }

        /* === EMPTY STATE === */
        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 4rem 2rem;
            color: var(--text-muted);
        }

        .empty-icon {
            font-size: 3rem;
            margin-bottom: 1rem;
            opacity: 0.5;
        }

        .empty-text {
            font-size: 0.95rem;
        }

        .empty-sub {
            font-size: 0.82rem;
            margin-top: 0.5rem;
            color: var(--text-muted);
        }

        /* === LOADING SKELETON === */
        .skeleton-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 1.25rem 1.5rem;
            animation: shimmer 1.5s infinite;
        }

        .skeleton-line {
            height: 12px;
            background: rgba(255, 255, 255, 0.06);
            border-radius: 6px;
            margin-bottom: 0.75rem;
        }

        .skeleton-line.short { width: 40%; }
        .skeleton-line.medium { width: 70%; }
        .skeleton-line.long { width: 100%; }

        @keyframes shimmer {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }

        /* === FOOTER === */
        .footer {
            text-align: center;
            padding: 2.5rem 0 0;
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        /* === SCROLLBAR === */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.08); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.15); }

        /* === TAGS === */
        .card-tags-area {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 1rem;
            align-items: center;
        }

        .tag-pill {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 3px 8px;
            background: rgba(99, 102, 241, 0.15);
            border: 1px solid rgba(99, 102, 241, 0.3);
            border-radius: 12px;
            font-size: 0.72rem;
            color: var(--primary-light);
            z-index: 2;
        }

        .tag-pill button {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 1rem;
            line-height: 1;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            outline: none;
        }
        
        .tag-pill button:hover {
            color: var(--danger);
        }

        .add-tag-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px dashed rgba(255, 255, 255, 0.2);
            color: var(--text-dim);
            padding: 3px 8px;
            border-radius: 12px;
            font-size: 0.72rem;
            cursor: pointer;
            transition: all 0.2s;
            z-index: 2;
        }

        .add-tag-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            color: var(--text);
            border-color: rgba(255, 255, 255, 0.4);
        }

        .add-tag-form {
            display: inline-block;
            position: relative;
            z-index: 3;
        }

        .add-tag-form input {
            background: rgba(0,0,0,0.5);
            border: 1px solid var(--border);
            color: #fff;
            padding: 3px 8px;
            border-radius: 12px;
            font-size: 0.72rem;
            outline: none;
            width: 100px;
            transition: border-color 0.2s;
        }
        
        .add-tag-form input:focus {
            border-color: var(--primary-light);
            box-shadow: 0 0 0 2px rgba(99, 102, 241, 0.2);
        }

        /* === RESPONSIVE === */
        .status-badge {
            font-size: 0.7rem;
            padding: 3px 6px;
            border-radius: 4px;
            font-weight: 600;
            margin-left: 6px;
        }
        .status-pending { background: rgba(239, 68, 68, 0.15); color: #fca5a5; }
        .status-update { background: rgba(245, 158, 11, 0.15); color: #fcd34d; }
        .status-published { background: rgba(16, 185, 129, 0.15); color: #6ee7b7; border: 1px solid rgba(16, 185, 129, 0.3); }

        .approve-btn {
            background: rgba(16, 185, 129, 0.15);
            border: 1px solid rgba(16, 185, 129, 0.4);
            color: #6ee7b7;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 0.75rem;
            cursor: pointer;
            transition: all 0.2s;
            margin-right: 8px;
            z-index: 2;
        }
        .approve-btn:hover {
            background: rgba(16, 185, 129, 0.3);
            color: #a7f3d0;
        }
        
        .card-controls {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 1.2rem;
            padding-top: 1rem;
            border-top: 1px solid rgba(255,255,255,0.05);
        }

        /* === RESPONSIVE === */
        @media (max-width: 900px) {
            .stats-row {
                grid-template-columns: repeat(2, 1fr);
            }
            .grid {
                grid-template-columns: 1fr;
            }
            .header {
                flex-direction: column;
                align-items: flex-start;
            }
            .header-actions {
                width: 100%;
                flex-wrap: wrap;
            }
            .search-box {
                width: 100%;
            }
        }

        @media (max-width: 500px) {
            .app {
                padding: 1rem 1rem 3rem;
            }
            .stats-row {
                grid-template-columns: 1fr 1fr;
                gap: 0.6rem;
            }
            .stat-card {
                padding: 1rem;
            }
            .stat-value {
                font-size: 1.4rem;
            }
            .header-title h1 {
                font-size: 1.3rem;
            }
            .tabs {
                width: 100%;
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <div class="leaf-container" id="leafContainer"></div>
    <div class="app">
        <!-- HEADER -->
        <header class="header">
            <div class="header-left">
                <div class="logo">&#x1F4D6;</div>
                <div class="header-title">
                    <h1>知识展示库</h1>
                    <p id="headerSubtitle">数据加载中...</p>
                </div>
            </div>
            <div class="header-actions">
                <div class="search-box">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor">
                        <path fill-rule="evenodd" d="M9 3.5a5.5 5.5 0 100 11 5.5 5.5 0 000-11zM2 9a7 7 0 1112.452 4.391l3.328 3.329a.75.75 0 11-1.06 1.06l-3.329-3.328A7 7 0 012 9z" clip-rule="evenodd"/>
                    </svg>
                    <input type="text" id="searchInput" placeholder="搜索知识库..." oninput="render()">
                </div>
            </div>
        </header>

        <!-- STATS -->
        <section class="stats-row" id="statsRow">
            <div class="stat-card">
                <div class="stat-label">云文档库</div>
                <div class="stat-value" id="statDocs">&mdash;</div>
                <div class="stat-sub">公开发布指南与文档</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">最近同步时间</div>
                <div class="stat-value" id="statLastSync">&mdash;</div>
                <div class="stat-sub" id="statLastSyncFull"></div>
            </div>
        </section>

        <!-- TOOLBAR -->
        <section class="toolbar">
        </section>

        <!-- DATA GRID -->
        <section class="grid" id="dataGrid">
            <div class="skeleton-card"><div class="skeleton-line short"></div><div class="skeleton-line long"></div><div class="skeleton-line medium"></div></div>
            <div class="skeleton-card"><div class="skeleton-line short"></div><div class="skeleton-line long"></div><div class="skeleton-line medium"></div></div>
            <div class="skeleton-card"><div class="skeleton-line short"></div><div class="skeleton-line long"></div><div class="skeleton-line medium"></div></div>
        </section>

        <!-- FOOTER -->
        <footer class="footer">
            自动刷新间隔：30 秒 &middot; 飞书 &times; OpenClaw 数据同步
        </footer>
    </div>

    <script>
        // =========== STATE ===========
        var allData = [];

        // =========== FETCH ===========
        async function fetchData() {
            try {
                var response = await fetch('/api/docs');
                if (!response.ok) throw new Error('API error');

                var docs = await response.json();

                var formattedDocs = docs.map(function(d) {
                    return {
                        id: d.doc_id,
                        type: '云文档',
                        title: String(d.title || '未命名文档'),
                        content: d.content || '飞书知识库在线文档',
                        tags: d.tags || [],
                        timeStr: formatTime(d.sync_time)
                    };
                });

                allData = formattedDocs;
                updateStats(docs);

                document.getElementById('headerSubtitle').textContent =
                    '共 ' + allData.length + ' 条记录 · 每小时自动同步';

                render();
            } catch (err) {
                console.error('数据加载失败:', err);
            }
        }

        // =========== HELPERS ===========
        function formatTime(ts) {
            try {
                var d = new Date(ts);
                var now = new Date();
                var diffMs = now - d;
                var diffMin = Math.floor(diffMs / 60000);
                if (diffMin < 1) return '刚刚';
                if (diffMin < 60) return diffMin + ' 分钟前';
                var diffHr = Math.floor(diffMin / 60);
                if (diffHr < 24) return diffHr + ' 小时前';
                return d.toLocaleDateString('zh-CN', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
            } catch (e) {
                return ts;
            }
        }

        function updateStats(docs) {
            document.getElementById('statDocs').textContent = docs.length;

            var allTimes = docs.map(function(d) { return d.sync_time; });
            if (allTimes.length > 0) {
                var latest = allTimes.map(function(t) { return new Date(t); }).sort(function(a, b) { return b - a; })[0];
                if (document.getElementById('statLastSync')) document.getElementById('statLastSync').textContent = formatTime(latest);
                if (document.getElementById('statLastSyncFull')) document.getElementById('statLastSyncFull').textContent = latest.toLocaleString('zh-CN');
            }
        }

        // =========== RENDER ===========
        function render() {
            var searchTerm = document.getElementById('searchInput').value.toLowerCase();
            var grid = document.getElementById('dataGrid');

            var filtered = allData.filter(function(item) {
                if (searchTerm) {
                    var safeTitle = item.title ? String(item.title) : '';
                    var safeContent = item.content ? String(item.content) : '';
                    var safeTags = item.tags ? item.tags.join(' ') : '';
                    var haystack = (safeTitle + ' | ' + safeContent + ' | ' + safeTags).toLowerCase();
                    
                    var searchWords = searchTerm.split(/\s+/).filter(Boolean);
                    for (var w = 0; w < searchWords.length; w++) {
                        if (haystack.indexOf(searchWords[w]) === -1) return false;
                    }
                }

                return true;
            });

            if (filtered.length === 0) {
                grid.innerHTML =
                    '<div class="empty-state">' +
                    '<div class="empty-icon">&#x1F50D;</div>' +
                    '<div class="empty-text">没有找到匹配的数据</div>' +
                    '<div class="empty-sub">' + (searchTerm ? '尝试其他关键词' : '暂无同步数据') + '</div>' +
                    '</div>';
                return;
            }

            grid.innerHTML = filtered.map(function(item, i) {
                var badgeClass = 'doc';
                var badgeIcon = '\uD83D\uDCC4';

                var tagsHTML = '<div class="card-tags-area">';
                var tagsList = (item.tags || []).map(function(t) {
                    return '<span class="tag-pill">' + escapeHtml(t) + '</span>';
                }).join('');
                
                tagsHTML += tagsList;
                tagsHTML += '</div>';

                var clickAction = 'window.open(\'/doc/' + item.id + '\', \'_blank\'); event.stopPropagation();';
                var expandHint = '在新标签页阅读原文 <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" style="width:14px;height:14px;margin-left:4px;"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14" /></svg>';

                return '<div class="card" onclick="' + clickAction + '" style="animation-delay:' + (i * 0.04) + 's">' +
                    '<div class="card-top">' +
                    '<span class="card-badge ' + badgeClass + '">' + badgeIcon + ' 云文档</span>' +
                    '<span class="card-time" style="margin-left:auto">' + item.timeStr + '</span>' +
                    '</div>' +
                    '<div class="card-title">' + escapeHtml(item.title) + '</div>' +
                    '<div class="card-preview">' + escapeHtml(item.content) + '</div>' +
                    tagsHTML +
                    '<div class="card-expand-hint">' + expandHint + '</div>' +
                    '</div>';
            }).join('');
        }

        function escapeHtml(str) {
            var div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        // =========== INIT ===========
        // ==== 生成飘落的绿叶 ====
        function initLeaves() {
            const container = document.getElementById('leafContainer');
            const leafCount = 8;
            const leafPath = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M17,8C8,10 5.9,16.17 3.82,21.34L5.71,22L6.66,19.7C7.14,19.87 7.64,20 8,20C19,20 22,3 22,3C21,5 14,5.25 9,6.25C4,7.25 7,14 7,14C7,14 14,8 17,8Z" /></svg>';
            
            for (let i = 0; i < leafCount; i++) {
                const leaf = document.createElement('div');
                leaf.className = 'leaf';
                leaf.innerHTML = leafPath;
                
                const leftPos = Math.random() * 100 + 'vw';
                const delay = Math.random() * 15 + 's';
                const duration = (Math.random() * 15 + 15) + 's';
                const rotateStart = Math.random() * 360 + 'deg';
                const scale = Math.random() * 0.5 + 0.6;

                leaf.style.left = leftPos;
                leaf.style.setProperty('--delay', delay);
                leaf.style.setProperty('--duration', duration);
                leaf.style.setProperty('--rotate-start', rotateStart);
                leaf.style.transform = `scale(${scale})`;

                container.appendChild(leaf);
            }
        }
        
        setTimeout(initLeaves, 100);

        fetchData();
        setInterval(fetchData, 30000);
    </script>
</body>
</html>
