<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>飞书文档预览</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* ============================================================
           CSS 变量 & 主题系统
        ============================================================ */
        :root {
            --primary: #10b981;
            --primary-light: #34d399;
            --bg: #f8fafc;
            --card: rgba(255,255,255,0.9);
            --text: #334155;
            --text-dim: #64748b;
            --text-muted: #94a3b8;
            --border: rgba(16,185,129,0.15);
            --radius: 12px;
            --header-bg: rgba(255,255,255,0.85);
        }

        /* === 经典白主题 === */
        body.style-classic {
            --primary: #3b82f6;
            --primary-light: #60a5fa;
            --bg: #f0f9ff;
            --card: rgba(255,255,255,0.95);
            --text: #1e293b;
            --text-dim: #475569;
            --border: rgba(59,130,246,0.15);
            --header-bg: rgba(240,249,255,0.9);
        }

        /* === 高级绿主题 === */
        body.style-premium {
            --primary: #10b981;
            --primary-light: #34d399;
            --bg: #f0fdf4;
            --card: rgba(255,255,255,0.88);
            --text: #1e3a2f;
            --text-dim: #3d6a55;
            --border: rgba(16,185,129,0.2);
            --header-bg: rgba(240,253,244,0.9);
        }

        /* === 暗黑主题 === */
        body.style-dark {
            --primary: #818cf8;
            --primary-light: #a5b4fc;
            --bg: #0f0f1a;
            --card: rgba(22,22,40,0.95);
            --text: #e2e8f0;
            --text-dim: #94a3b8;
            --text-muted: #64748b;
            --border: rgba(129,140,248,0.2);
            --header-bg: rgba(15,15,26,0.9);
        }

        /* ============================================================
           基础样式
        ============================================================ */
        *, *::before, *::after { box-sizing: border-box; }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg);
            color: var(--text);
            margin: 0; padding: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            transition: background 0.5s ease, color 0.5s ease;
        }

        /* ============================================================
           顶部阅读进度条
        ============================================================ */
        #progressBar {
            position: fixed;
            top: 0; left: 0;
            height: 3px;
            width: 0%;
            background: linear-gradient(90deg, var(--primary), var(--primary-light));
            z-index: 999;
            transition: width 0.1s linear;
        }

        /* ============================================================
           动态背景容器 (共用)
        ============================================================ */
        #bgCanvas {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        /* ============================================================
           顶部导航栏
        ============================================================ */
        .header {
            padding: 1rem 2rem;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--header-bg);
            backdrop-filter: blur(16px);
            position: sticky;
            top: 0;
            z-index: 50;
            transition: background 0.5s ease;
        }

        .title-group h1 {
            margin: 0;
            font-size: 1.2rem;
            background: linear-gradient(135deg, var(--primary), var(--primary-light));
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            max-width: 600px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .title-group p {
            margin: 3px 0 0;
            font-size: 0.75rem;
            color: var(--text-dim);
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .btn-header {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 0.45rem 0.9rem;
            border-radius: 8px;
            font-size: 0.8rem;
            font-weight: 500;
            cursor: pointer;
            border: 1px solid var(--border);
            background: transparent;
            color: var(--text-dim);
            transition: all 0.2s;
            font-family: inherit;
        }
        .btn-header:hover {
            background: rgba(128,128,128,0.1);
            color: var(--primary);
            border-color: var(--primary);
        }

        /* ============================================================
           主题切换器
        ============================================================ */
        .theme-switcher {
            display: flex;
            gap: 4px;
            background: rgba(128,128,128,0.08);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 3px;
        }
        .theme-btn {
            padding: 4px 10px;
            border-radius: 7px;
            font-size: 0.72rem;
            font-weight: 600;
            cursor: pointer;
            border: none;
            background: transparent;
            color: var(--text-muted);
            transition: all 0.2s;
            font-family: inherit;
        }
        .theme-btn.active {
            background: var(--primary);
            color: #fff;
        }
        .theme-btn:not(.active):hover {
            background: rgba(128,128,128,0.12);
            color: var(--text);
        }

        /* ============================================================
           主要内容区域
        ============================================================ */
        .main-wrapper {
            display: flex;
            align-items: flex-start;
            max-width: 1300px;
            margin: 0 auto;
            width: 100%;
            gap: 2rem;
            padding: 2rem;
            flex: 1;
            position: relative;
            z-index: 1;
        }

        /* ============================================================
           侧边栏 (仅 premium 模式可见)
        ============================================================ */
        .sidebar {
            width: 240px;
            flex-shrink: 0;
            position: sticky;
            top: 90px;
            max-height: calc(100vh - 130px);
            overflow-y: auto;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            backdrop-filter: blur(8px);
            padding: 1.25rem 1rem;
            display: none;
            transition: all 0.3s ease;
        }
        body.style-classic .sidebar,
        body.style-premium .sidebar,
        body.style-dark .sidebar { display: block; }

        .sidebar::-webkit-scrollbar { width: 3px; }
        .sidebar::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

        .sidebar-title {
            font-size: 0.72rem;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 0.75rem;
            padding-left: 0.5rem;
        }

        .toc-list { list-style: none; padding: 0; margin: 0; }
        .toc-item { margin-bottom: 2px; }
        .toc-link {
            display: block;
            text-decoration: none;
            color: var(--text-dim);
            font-size: 0.82rem;
            padding: 0.35rem 0.5rem;
            border-radius: 6px;
            transition: all 0.2s;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            border-left: 2px solid transparent;
        }
        .toc-link:hover { background: rgba(128,128,128,0.06); color: var(--primary); }
        .toc-link.active { color: var(--primary); background: rgba(128,128,128,0.08); border-left-color: var(--primary); font-weight: 600; }
        .toc-level-1 { padding-left: 0.5rem; font-weight: 500; }
        .toc-level-2 { padding-left: 1.2rem; font-size: 0.78rem; }
        .toc-level-3 { padding-left: 2rem; font-size: 0.75rem; }
        .toc-level-4 { padding-left: 2.8rem; font-size: 0.72rem; }

        /* ============================================================
           正文内容区域
        ============================================================ */
        .article-container {
            flex: 1;
            min-width: 0;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            box-shadow: 0 8px 32px rgba(0,0,0,0.06);
            backdrop-filter: blur(12px);
            padding: 3rem 4rem;
            transition: background 0.5s ease, border-color 0.5s ease;
        }

        /* === 文档内容排版 === */
        .doc-content h1 { font-size: 1.9rem; margin: 2rem 0 1rem; color: var(--primary); scroll-margin-top: 100px; }
        .doc-content h2 { font-size: 1.45rem; margin: 1.8rem 0 0.8rem; border-bottom: 2px solid var(--border); padding-bottom: 0.4rem; color: var(--primary); scroll-margin-top: 100px; }
        .doc-content h3 { font-size: 1.2rem; margin: 1.4rem 0 0.6rem; color: var(--primary-light); scroll-margin-top: 100px; }
        .doc-content h4 { font-size: 1.05rem; margin: 1.2rem 0 0.5rem; color: var(--text-dim); scroll-margin-top: 100px; }
        .doc-content p { line-height: 1.85; margin-bottom: 1.2rem; color: var(--text); }
        .doc-content ul, .doc-content ol { padding-left: 1.8rem; margin-bottom: 1.2rem; color: var(--text); line-height: 1.7; }
        .doc-content li { margin-bottom: 0.5rem; }
        .doc-content blockquote { border-left: 4px solid var(--primary); margin: 1.5rem 0; padding: 0.8rem 1.2rem; background: rgba(128,128,128,0.05); color: var(--text-dim); border-radius: 0 8px 8px 0; }
        .doc-content pre { background: rgba(0,0,0,0.07); padding: 1.2rem; border-radius: 8px; overflow-x: auto; border: 1px solid var(--border); margin: 1.5rem 0; }
        .doc-content code { font-family: 'Fira Code', monospace; color: var(--primary); font-size: 0.9em; }
        body.style-dark .doc-content pre { background: rgba(255,255,255,0.04); }

        .loading { text-align: center; padding: 4rem; color: var(--text-dim); }
        .error-msg { color: #f87171; text-align: center; padding: 2rem; background: rgba(248,113,113,0.08); border-radius: 8px; border: 1px solid rgba(248,113,113,0.2); }
        .raw-json { font-size: 0.78rem; color: var(--text-muted); padding: 1rem; line-height: 1.5; white-space: pre-wrap; word-break: break-all; background: rgba(0,0,0,0.04); border-radius: 8px; }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: var(--text-dim);
            text-decoration: none;
            font-size: 0.85rem;
            transition: color 0.2s;
        }
        .back-link:hover { color: var(--primary); }

        /* ============================================================
           响应式
        ============================================================ */
        @media (max-width: 900px) {
            .main-wrapper { flex-direction: column; padding: 1rem; gap: 1rem; }
            body.style-premium .sidebar { width: 100%; position: static; max-height: 220px; }
            .article-container { padding: 1.5rem; }
            .title-group h1 { max-width: 200px; }
            .theme-switcher { display: none; }
        }

        /* ============================================================
           气泡动画 (经典白)
        ============================================================ */
        .bubble {
            position: absolute;
            bottom: -80px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, rgba(147,197,253,0.6), rgba(59,130,246,0.15));
            border: 1px solid rgba(59,130,246,0.25);
            backdrop-filter: blur(2px);
            animation: bubbleRise var(--dur) ease-in infinite;
            animation-delay: var(--delay);
        }
        @keyframes bubbleRise {
            0%   { transform: translateY(0) translateX(0) scale(1); opacity: 0; }
            10%  { opacity: 1; }
            80%  { opacity: 0.7; }
            100% { transform: translateY(-110vh) translateX(var(--drift)) scale(0.8); opacity: 0; }
        }

        /* ============================================================
           落叶动画 (高级绿)
        ============================================================ */
        .leaf {
            position: absolute;
            top: -50px;
            width: 28px; height: 28px;
            fill: rgba(16,185,129,0.2);
            filter: blur(0.5px);
            animation: leafFall var(--duration) linear infinite, leafSway 5s ease-in-out infinite alternate;
            animation-delay: var(--delay);
            transform: rotate(var(--rotate-start));
        }
        @keyframes leafFall {
            0%   { top: -50px; opacity: 0; }
            10%  { opacity: 0.9; }
            80%  { opacity: 0.7; }
            100% { top: 110vh; opacity: 0; }
        }
        @keyframes leafSway {
            0%   { transform: translateX(0px) rotate(0deg); }
            100% { transform: translateX(55px) rotate(60deg); }
        }

        /* ============================================================
           雷电动画 (暗黑)
        ============================================================ */
        .lightning {
            position: absolute;
            top: 0;
            width: 2px;
            background: linear-gradient(to bottom, transparent, #818cf8, #c4b5fd, transparent);
            border-radius: 2px;
            filter: blur(1px) drop-shadow(0 0 6px #818cf8);
            opacity: 0;
            transform-origin: top center;
            animation: lightningStrike var(--dur) ease-out infinite;
            animation-delay: var(--delay);
        }
        @keyframes lightningStrike {
            0%   { opacity: 0; transform: scaleY(0); }
            3%   { opacity: 1; transform: scaleY(1); filter: blur(0px) drop-shadow(0 0 12px #c4b5fd); }
            6%   { opacity: 0.4; }
            8%   { opacity: 1; filter: blur(0px) drop-shadow(0 0 20px #fff); }
            12%  { opacity: 0; transform: scaleY(1); }
            100% { opacity: 0; }
        }
    </style>
</head>
<body class="style-classic">

    <!-- 阅读进度条 -->
    <div id="progressBar"></div>

    <!-- 动态背景 -->
    <div id="bgCanvas"></div>

    <!-- 顶部导航 -->
    <header class="header">
        <div class="title-group">
            <h1 id="docTitle">加载中...</h1>
            <p id="docMeta">飞书云文档在线预览</p>
        </div>
        <div class="header-actions">
            <!-- 主题切换器 -->
            <div class="theme-switcher">
                <button class="theme-btn active" id="btn-classic" onclick="switchTheme('classic')">🫧 经典</button>
                <button class="theme-btn" id="btn-premium" onclick="switchTheme('premium')">🌱 高级绿</button>
                <button class="theme-btn" id="btn-dark" onclick="switchTheme('dark')">⚡ 暗黑</button>
            </div>
            <button class="btn-header" onclick="window.print()">
                <svg width="13" height="13" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z"/></svg>
                导出 PDF
            </button>
            <a href="javascript:history.back()" class="back-link">
                <svg width="15" height="15" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/></svg>
                返回
            </a>
        </div>
    </header>

    <!-- 主体 -->
    <div class="main-wrapper">
        <!-- 侧边大纲 (仅 premium 显示) -->
        <aside class="sidebar" id="tocSidebar">
            <div class="sidebar-title">文档大纲</div>
            <ul class="toc-list" id="tocList"></ul>
        </aside>

        <!-- 正文 -->
        <main class="article-container" id="contentArea">
            <div class="loading">正在拉取飞书文档数据，请稍候...</div>
        </main>
    </div>

    <script>
    // =====================================================
    // 0. 主题系统与 URL 路由
    // =====================================================
    const THEMES = ['classic', 'premium', 'dark'];
    let currentTheme = 'classic';

    function applyTheme(theme) {
        if (!THEMES.includes(theme)) theme = 'classic';
        currentTheme = theme;
        document.body.className = 'style-' + theme;

        // 更新按钮状态
        THEMES.forEach(t => {
            const btn = document.getElementById('btn-' + t);
            if (btn) btn.classList.toggle('active', t === theme);
        });

        // 更新 URL 参数（不触发页面刷新）
        const url = new URL(window.location.href);
        url.searchParams.set('style', theme);
        history.replaceState(null, '', url.toString());

        // 重新初始化动画
        initBgAnimation(theme);
    }

    function switchTheme(theme) {
        applyTheme(theme);
    }

    // =====================================================
    // 1. 动态背景系统
    // =====================================================
    function initBgAnimation(theme) {
        const canvas = document.getElementById('bgCanvas');
        canvas.innerHTML = '';

        if (theme === 'classic') initBubbles(canvas);
        else if (theme === 'premium') initLeaves(canvas);
        else if (theme === 'dark') initLightning(canvas);
    }

    function initBubbles(container) {
        const count = 35;
        for (let i = 0; i < count; i++) {
            const el = document.createElement('div');
            el.className = 'bubble';
            const size = Math.random() * 40 + 14;
            el.style.cssText = `
                width: ${size}px;
                height: ${size}px;
                left: ${Math.random() * 100}%;
                --dur: ${Math.random() * 5 + 3}s;
                --delay: ${Math.random() * 6}s;
                --drift: ${(Math.random() - 0.5) * 80}px;
            `;
            container.appendChild(el);
        }
    }

    function initLeaves(container) {
        const count = 24;
        const leafSVG = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M17,8C8,10 5.9,16.17 3.82,21.34L5.71,22L6.66,19.7C7.14,19.87 7.64,20 8,20C19,20 22,3 22,3C21,5 14,5.25 9,6.25C4,7.25 7,14 7,14C7,14 14,8 17,8Z"/></svg>`;
        for (let i = 0; i < count; i++) {
            const el = document.createElement('div');
            el.className = 'leaf';
            el.innerHTML = leafSVG;
            el.style.cssText = `
                left: ${Math.random() * 100}%;
                --duration: ${Math.random() * 7 + 7}s;
                --delay: ${Math.random() * 8}s;
                --rotate-start: ${Math.random() * 360}deg;
                transform: scale(${Math.random() * 0.5 + 0.6});
            `;
            container.appendChild(el);
        }
    }

    function initLightning(container) {
        const count = 16;
        for (let i = 0; i < count; i++) {
            const el = document.createElement('div');
            el.className = 'lightning';
            const height = Math.random() * 40 + 20;
            el.style.cssText = `
                left: ${Math.random() * 100}%;
                height: ${height}vh;
                --dur: ${Math.random() * 2 + 1.5}s;
                --delay: ${Math.random() * 3}s;
            `;
            container.appendChild(el);
        }
    }

    // =====================================================
    // 2. 阅读进度条
    // =====================================================
    function updateProgressBar() {
        const bar = document.getElementById('progressBar');
        const scrollTop = document.documentElement.scrollTop;
        const docHeight = document.documentElement.scrollHeight - document.documentElement.clientHeight;
        const pct = docHeight > 0 ? (scrollTop / docHeight) * 100 : 0;
        bar.style.width = pct + '%';
    }
    window.addEventListener('scroll', updateProgressBar, { passive: true });

    // =====================================================
    // 3. 飞书文档加载与渲染
    // =====================================================
    const docId = window.location.pathname.split('/').pop();
    let tocData = [];

    async function init() {
        const area = document.getElementById('contentArea');
        try {
            const res = await fetch('/api/doc/' + docId);
            if (!res.ok) throw new Error(await res.text());

            const data = await res.json();
            document.getElementById('docTitle').textContent = data.title || '飞书文档';
            document.title = (data.title || '飞书文档') + ' - 知识库';
            document.getElementById('docMeta').textContent = '最后同步：' + new Date(data.sync_time).toLocaleString('zh-CN');

            let parsedContent = null;
            try {
                parsedContent = typeof data.content === 'string' ? JSON.parse(data.content) : data.content;
            } catch(e) {}

            if (parsedContent && parsedContent.document && parsedContent.blocks) {
                area.innerHTML = '<div class="doc-content">' + renderFeishuBlocks(parsedContent) + '</div>';
                buildTOC();
            } else {
                let raw = typeof data.content === 'object' ? JSON.stringify(data.content, null, 2) : String(data.content || '暂无内容');
                area.innerHTML = `
                    <div class="error-msg">由于同步脚本仅拉取了基础信息，未能获取飞书文档 Blocks 正文，以下为原始数据：</div>
                    <div class="raw-json">${escapeHtml(raw)}</div>
                `;
            }
        } catch(err) {
            document.getElementById('docTitle').textContent = '加载失败';
            area.innerHTML = '<div class="error-msg">文档拉取失败：' + escapeHtml(err.message) + '</div>';
        }
    }

    // =====================================================
    // 4. 飞书 Block 渲染引擎
    // =====================================================
    function renderFeishuBlocks(feishuData) {
        tocData = [];
        const blocks = feishuData.blocks || [];
        if (!blocks.length) return '<p>空文档</p>';

        const blockMap = {};
        blocks.forEach(b => blockMap[b.block_id] = b);

        const pageBlock = blocks.find(b => b.block_type === 1);
        if (!pageBlock) return '<p class="error-msg">未能找到根页面块</p>';

        function extractElements(b) {
            for (let k in b) {
                if (b[k] && Array.isArray(b[k].elements)) return b[k].elements;
            }
            return null;
        }

        function renderElements(elements) {
            let plain = '';
            let html = (elements || []).map(e => {
                const content = e.text_run ? e.text_run.content : '';
                plain += content;
                const style = e.text_run && e.text_run.text_element_style || {};
                let s = escapeHtml(content);
                if (style.bold) s = `<strong>${s}</strong>`;
                if (style.italic) s = `<em>${s}</em>`;
                if (style.strikethrough) s = `<del>${s}</del>`;
                if (style.underline) s = `<u>${s}</u>`;
                if (style.inline_code) s = `<code>${s}</code>`;
                return s;
            }).join('').replace(/\n/g, '<br>');
            return { html, plain };
        }

        function renderBlock(blockId) {
            const b = blockMap[blockId];
            if (!b) return '';

            const elements = extractElements(b);
            const { html: text, plain: plainText } = renderElements(elements);
            const anchorId = 'b_' + blockId;
            let html = '';

            switch (b.block_type) {
                case 2:  html = `<p>${text}</p>`; break;
                case 3:
                    html = `<h1 id="${anchorId}">${text}</h1>`;
                    if (plainText.trim()) tocData.push({ id: anchorId, text: plainText, level: 1 });
                    break;
                case 4:
                    html = `<h2 id="${anchorId}">${text}</h2>`;
                    if (plainText.trim()) tocData.push({ id: anchorId, text: plainText, level: 2 });
                    break;
                case 5:
                    html = `<h3 id="${anchorId}">${text}</h3>`;
                    if (plainText.trim()) tocData.push({ id: anchorId, text: plainText, level: 3 });
                    break;
                case 6:
                    html = `<h4 id="${anchorId}">${text}</h4>`;
                    if (plainText.trim()) tocData.push({ id: anchorId, text: plainText, level: 4 });
                    break;
                case 11: html = `<li>${text}</li>`; break;
                case 12: html = `<li>${text}</li>`; break;
                case 14: html = `<pre><code>${text.replace(/<br>/g, '\n')}</code></pre>`; break;
                case 15: html = `<blockquote>${text}</blockquote>`; break;
                case 22: html = '<hr>'; break;
                default:
                    if (b.block_type !== 1 && text) html = `<p>${text}</p>`;
            }

            if (b.children && b.children.length > 0) {
                let childrenHtml = '';
                let listType = null;

                b.children.forEach(childId => {
                    const cb = blockMap[childId];
                    if (!cb) return;
                    const isBullet = cb.block_type === 11;
                    const isOrdered = cb.block_type === 12;

                    if (isBullet) {
                        if (listType !== 'ul') {
                            if (listType) childrenHtml += `</${listType}>`;
                            listType = 'ul'; childrenHtml += '<ul>';
                        }
                    } else if (isOrdered) {
                        if (listType !== 'ol') {
                            if (listType) childrenHtml += `</${listType}>`;
                            listType = 'ol'; childrenHtml += '<ol>';
                        }
                    } else {
                        if (listType) { childrenHtml += `</${listType}>`; listType = null; }
                    }
                    childrenHtml += renderBlock(childId);
                });
                if (listType) childrenHtml += `</${listType}>`;

                if (b.block_type === 1) html += childrenHtml;
                else if (b.block_type !== 11 && b.block_type !== 12) html += `<div style="padding-left:1.5rem;">${childrenHtml}</div>`;
                else html += childrenHtml;
            }

            return html;
        }

        return renderBlock(pageBlock.block_id);
    }

    // =====================================================
    // 5. 目录大纲 (TOC)
    // =====================================================
    function buildTOC() {
        if (!tocData.length) return;
        const list = document.getElementById('tocList');
        list.innerHTML = tocData.map(item =>
            `<li class="toc-item">
                <a href="#${item.id}" class="toc-link toc-level-${item.level}" title="${escapeHtml(item.text)}">
                    ${escapeHtml(item.text)}
                </a>
            </li>`
        ).join('');
        setupScrollSpy();
    }

    function setupScrollSpy() {
        const headings = Array.from(document.querySelectorAll('.doc-content h1, .doc-content h2, .doc-content h3, .doc-content h4'));
        const tocLinks = document.querySelectorAll('.toc-link');
        if (!headings.length) return;

        const observer = new IntersectionObserver(entries => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    tocLinks.forEach(l => l.classList.remove('active'));
                    const t = document.querySelector(`.toc-link[href="#${entry.target.id}"]`);
                    if (t) { t.classList.add('active'); t.scrollIntoView({ behavior: 'smooth', block: 'nearest' }); }
                }
            });
        }, { rootMargin: '-90px 0px -60% 0px' });

        headings.forEach(h => observer.observe(h));

        tocLinks.forEach(link => {
            link.addEventListener('click', e => {
                e.preventDefault();
                const target = document.getElementById(link.getAttribute('href').substring(1));
                if (target) {
                    window.scrollTo({ top: target.offsetTop - 80, behavior: 'smooth' });
                    tocLinks.forEach(l => l.classList.remove('active'));
                    link.classList.add('active');
                }
            });
        });
    }

    // =====================================================
    // 6. 工具函数
    // =====================================================
    function escapeHtml(str) {
        if (!str) return '';
        const d = document.createElement('div');
        d.textContent = str;
        return d.innerHTML;
    }

    // =====================================================
    // 7. 初始化入口
    // =====================================================
    (function start() {
        // 从 URL 参数读取样式
        const params = new URLSearchParams(window.location.search);
        const style = params.get('style') || 'classic';
        applyTheme(style);

        // 加载文档
        init();
    })();
    </script>
</body>
</html>
